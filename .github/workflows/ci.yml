name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled: a force-pushed branch should not hold a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# THERE ARE NO SECRETS HERE, ON PURPOSE.
#
# The values below are placeholders. Every request the browser app makes is intercepted
# by `e2e/fixtures/app-mock.ts`, and any Supabase request the mock does not answer is
# aborted rather than passed through - so the app under test cannot reach the hosted
# project even if a gap in the fixture exists. The variables are present only because
# `src/integrations/supabase/client.ts` throws when they are missing.
#
# This is why the workflow needs no repository secrets at all:
#
#   - No `SUPABASE_SERVICE_ROLE_KEY` is provided to any job. The operator scripts that
#     read it are not run here.
#   - A broken mock fails the browser job rather than silently reaching production,
#     because production is not the fallback - an abort is.
#
# `npm run lint` is deliberately absent. It reports a large pre-existing Prettier backlog
# that predates this work, so it would fail every run for a reason unrelated to the change
# under test. It is documented as out of scope rather than fixed or silently ignored.
env:
  SUPABASE_URL: https://e2e-placeholder.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  VITE_SUPABASE_URL: https://e2e-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  browser:
    # One runner, and this time from measurement on CI rather than from the shape of the
    # old job.
    #
    #   1 shard, 90 tests                      3m48s
    #   2 shards, ~45 each                     3m30s and 3m25s
    #   checks (typecheck, unit, build)        1m18s
    #
    # Halving the tests bought 18 seconds, so the job is not machine-bound any more - the
    # per-runner *fixed* cost is what dominates it. Each runner pays `npm ci`, a
    # `--with-deps chromium` install (apt packages plus the browser) and a cold Vite dev
    # server, and that is roughly three minutes before the first test runs. Sharding now
    # buys about twenty seconds for about three and a half billed minutes, which is not a
    # trade worth making. Four shards was the right answer while the contrast, typography
    # and criteria sweeps multiplied the same routes by one another and the test time was
    # large enough to divide; that is no longer the case.
    #
    # The fixed cost is where the remaining minutes are. Caching the Chromium download or
    # running the suite against `npm run build` output instead of a dev server are the two
    # obvious levers, and neither belongs in this change.
    #
    # Re-measure with the job's own wall time after adding or removing a spec file. A local
    # `npm run test:e2e` was 41s, which is not the number to judge this by.
    name: Rendered app, hermetic
    runs-on: ubuntu-latest
    env:
      # A missing prerequisite fails rather than skips. The skip guard below makes a skip a
      # failure anyway; this fails at the point of skipping with a clearer message.
      E2E_REQUIRE_STAFF: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      # The skip guard, run against the JSON report the config always writes. A skipped
      # test is never a passing test.
      - run: node scripts/assert-no-skips.mjs

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
