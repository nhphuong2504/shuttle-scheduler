name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled: a force-pushed branch should not hold a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# THERE ARE NO SECRETS HERE, ON PURPOSE.
#
# The values below are placeholders. Every request the browser app makes is intercepted
# by `e2e/fixtures/app-mock.ts`, and any Supabase request the mock does not answer is
# aborted rather than passed through - so the app under test cannot reach the hosted
# project even if a gap in the fixture exists. The variables are present only because
# `src/integrations/supabase/client.ts` throws when they are missing.
#
# This is why the workflow needs no repository secrets at all:
#
#   - No `SUPABASE_SERVICE_ROLE_KEY` is provided to any job. The operator scripts that
#     read it are not run here.
#   - A broken mock fails the browser job rather than silently reaching production,
#     because production is not the fallback - an abort is.
#
# `npm run lint` is deliberately absent. It reports a large pre-existing Prettier backlog
# that predates this work, so it would fail every run for a reason unrelated to the change
# under test. It is documented as out of scope rather than fixed or silently ignored.
env:
  SUPABASE_URL: https://e2e-placeholder.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  VITE_SUPABASE_URL: https://e2e-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  browser:
    # One runner. The suite is small now that the rendered UI sweeps are gone - 90 tests
    # spanning routing, access, hydration and the staff/public surfaces - and they finish
    # in well under two minutes on a 4 vCPU runner, so sharding would only add startup
    # cost. It was sharded across four while the contrast, typography and criteria sweeps
    # multiplied the same routes; re-measure with a plain `npm run test:e2e` if the suite
    # grows an expensive spec again.
    name: Rendered app, hermetic
    runs-on: ubuntu-latest
    env:
      # A missing prerequisite fails rather than skips. The skip guard below makes a skip a
      # failure anyway; this fails at the point of skipping with a clearer message.
      E2E_REQUIRE_STAFF: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      # The skip guard, run against the JSON report the config always writes. A skipped
      # test is never a passing test.
      - run: node scripts/assert-no-skips.mjs

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
