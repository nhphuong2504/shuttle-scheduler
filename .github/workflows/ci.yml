name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled: a force-pushed branch should not hold a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# THERE ARE NO SECRETS HERE, ON PURPOSE.
#
# The values below are placeholders. Every request the browser app makes is intercepted
# by `e2e/fixtures/app-mock.ts`, and any Supabase request the mock does not answer is
# aborted rather than passed through - so the app under test cannot reach the hosted
# project even if a gap in the fixture exists. The variables are present only because
# `src/integrations/supabase/client.ts` throws when they are missing.
#
# This is why the workflow needs no repository secrets at all:
#
#   - No `SUPABASE_SERVICE_ROLE_KEY` is provided to any job. The operator scripts that
#     read it are not run here.
#   - A broken mock fails the browser job rather than silently reaching production,
#     because production is not the fallback - an abort is.
#
# `npm run lint` is deliberately absent. It reports a large pre-existing Prettier backlog
# that predates this work, so it would fail every run for a reason unrelated to the change
# under test. It is documented as out of scope rather than fixed or silently ignored.
env:
  SUPABASE_URL: https://e2e-placeholder.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  VITE_SUPABASE_URL: https://e2e-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  browser:
    # Sharded, not because the tests are slow individually but because the job is
    # machine-bound. `ubuntu-latest` has 4 vCPU and a Playwright worker drives a whole
    # Chromium, so 2 workers already saturate the runner: raising the worker count to 4
    # measured 1132s against 1141s, i.e. no gain, while inflating per-test cost 1.9x and
    # failing 20 tests on contention. More workers cannot help a job that has no free CPU.
    # More machines can.
    #
    # The denominator is `strategy.job-total`, derived from the matrix, so adding a shard
    # cannot leave the two halves disagreeing about how many there are.
    name: Rendered app, hermetic (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      # Both shards report even when one fails. One shard's failure should not hide the
      # other's, which is most of the reason for splitting the run in the first place.
      fail-fast: false
      matrix:
        # 4 shards, chosen from measurement rather than intuition - see `npm run
        # ci:shard-plan`, which prints the wall time and billed minutes for each count.
        #
        # Re-measured when the density axis was removed, which took the suite from 297
        # tests to 161. 4 shards now predicts 2.5 min wall on 7.3 billed minutes. 3 is
        # slower (3.1 min wall) and only slightly cheaper (6.4 billed), and 5 buys 0.2 min
        # of wall (2.3) for 0.9 more billed minutes, so the extra shard does not pay for
        # itself. 6 is worse on both counts (2.5 wall, 9.1 billed) - shards split by test
        # *count*, not duration, so a finer split shuffles the heavy specs back together.
        #
        # Re-run that script after adding or removing a spec file: the split is by test
        # count, so it reshuffles every shard boundary.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # The skip guard, run against the JSON report the config always writes. It runs per
      # shard: each shard is a separate runner with its own report, and a skipped test is
      # never a passing test whichever slice of the suite it was in.
      #
      # This is the one place the workflow goes slightly beyond the plan, which left the
      # final gate entirely local. The plan's stated goal was that "a skip can never be
      # read as a pass", and since the suite became hermetic the guard needs neither
      # credentials nor a recorded session - so running it here costs one step and closes
      # the loophole in CI as well as locally. `npm run test:e2e:final` differs only by also
      # setting `E2E_REQUIRE_STAFF=1`, which fails at the moment of skipping with a clearer
      # message; that remains the local phase-close gate.
      - run: node scripts/assert-no-skips.mjs

      # Named per shard: a matrix job cannot upload two artifacts under one name.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
